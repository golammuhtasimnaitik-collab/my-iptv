<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Live TV BD</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
</head>
<body style="background:#000; margin:0; text-align:center;">

    <video id="my-video" class="video-js vjs-default-skin" controls preload="auto" width="100%" height="300" autoplay>
        <source src="https://bdedatv.bdixsports.com/somoy/index.m3u8" type="application/x-mpegURL">
    </video>

    <div style="padding:20px;">
        <button onclick="changeChannel('https://bdedatv.bdixsports.com/somoy/index.m3u8')" style="padding:10px 20px; font-size:18px;">Somoy TV</button>
        <button onclick="changeChannel('https://bdedatv.bdixsports.com/tsports/index.m3u8')" style="padding:10px 20px; font-size:18px;">T Sports</button>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        var player = videojs('my-video');
        function changeChannel(url) {
            player.src({src: url, type: 'application/x-mpegURL'});
            player.play();
        }
    </script>
</body>
</html>
