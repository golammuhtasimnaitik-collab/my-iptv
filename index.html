<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV BD - Premium IPTV</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Hind Siliguri', sans-serif; }
        body { background-color: #0b0b0f; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        /* Premium Compact Header Style */
        .header-bar { padding: 12px; text-align: center; background: linear-gradient(180deg, #14141f 0%, #07070a 100%); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .animated-logo { font-size: 19px; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; background: linear-gradient(45deg, #00f2fe, #7928ca, #ff007f); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 4s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }

        .player-container { width: 100%; background: #000; position: relative; aspect-ratio: 16/9; max-height: 45vh; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .video-js { width: 100% !important; height: 100% !important; }
        .vjs-big-play-centered .vjs-big-play-button { background: linear-gradient(45deg, #ff007f, #7928ca) !important; border: none !important; width: 60px !important; height: 60px !important; line-height: 60px !important; border-radius: 50% !important; }

        .info-strip { background: #111116; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
        .info-strip h2 { font-size: 16px; font-weight: 600; color: #fff; }
        .live-badge { background: rgba(255, 0, 127, 0.12); border: 1px solid rgba(255, 0, 127, 0.25); color: #ff007f; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .badge-dot { width: 6px; height: 6px; background-color: #ff007f; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        .category-nav { display: flex; overflow-x: auto; white-space: nowrap; padding: 14px 15px; background: #0b0b0f; gap: 10px; scrollbar-width: none; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-tab { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); color: #a0a0ab; padding: 7px 16px; border-radius: 25px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; }
        .cat-tab:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
        .cat-tab.active { background: #ffffff; color: #000000; font-weight: 600; border-color: #ffffff; box-shadow: 0 4px 12px rgba(255,255,255,0.15); }

        .content-section { flex: 1; padding: 5px 15px 30px 15px; background: #0b0b0f; }
        .channel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        
        .grid-card { background: #14141f; border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; transition: all 0.2s ease; min-height: 105px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .grid-card:hover { transform: translateY(-2px); border-color: #ff007f; }
        .grid-card.active { border-color: #ff007f; background: linear-gradient(145deg, #1c0f24, #14141f); box-shadow: 0 8px 20px rgba(255, 0, 127, 0.2); }

        .logo-bubble { width: 48px; height: 48px; background: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden; padding: 4px; transition: all 0.2s ease; }
        .logo-bubble img { width: 100%; height: 100%; object-fit: contain; }
        
        .grid-card.active .logo-bubble { border-color: #ff007f; box-shadow: 0 0 12px rgba(255, 0, 127, 0.5); background: #ffffff; }
        
        .channel-name { font-size: 11px; font-weight: 500; color: #e2e2e9; line-height: 1.3; }
        .channel-tag { font-size: 9px; color: #65657b; margin-top: 3px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }

        .footer-branding { text-align: center; padding: 22px; background: #07070a; border-top: 1px solid rgba(255, 255, 255, 0.03); font-size: 11px; color: #555566; letter-spacing: 1px; font-weight: 500; text-transform: uppercase; }
        .footer-branding span { color: #ff007f; font-weight: 600; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="animated-logo">Live TV BD</div>
    </div>

    <div class="player-container">
        <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay preload="auto">
            <p class="vjs-no-js">HTML5 Video not supported.</p>
        </video>
    </div>

    <div class="info-strip">
        <h2 id="current-channel-title">Somoy TV</h2>
        <div class="live-badge"><div class="badge-dot"></div> Live</div>
    </div>

    <div class="category-nav">
        <div class="cat-tab active" onclick="filterCategory('all', this)">All Channels</div>
        <div class="cat-tab" onclick="filterCategory('news', this)">News</div>
        <div class="cat-tab" onclick="filterCategory('sports', this)">Sports</div>
        <div class="cat-tab" onclick="filterCategory('entertainment', this)">Entertainment</div>
    </div>

    <div class="content-section">
        <div class="channel-grid" id="grid-container">
            
            <div class="grid-card active" data-category="news" onclick="playChannel('https://bdedatv.bdixsports.com/somoy/index.m3u8', 'Somoy TV', this)">
                <div class="logo-bubble"><img src="https://i.postimg.co/7Ym6F6W2/somoy.png" onerror="this.src='https://i.postimg.co/D0m4mGfW/tv-placeholder.png'" alt="Somoy"></div>
                <div class="channel-name">Somoy TV</div>
                <div class="channel-tag">News</div>
            </div>
            <div class="grid-card" data-category="news" onclick="playChannel('https://streaming.jamuna.tv/live/jamunatv/playlist.m3u8', 'Jamuna TV', this)">
                <div class="logo-bubble"><img src="https://i.postimg.co/fbw4Xw7y/jamuna.png" onerror="this.src='https://i.postimg.co/D0m4mGfW/tv-placeholder.png'" alt="Jamuna"></div>
                <div class="channel-name">Jamuna TV</div>
                <div class="channel-tag">News</div>
            </div>

            <div class="grid-card" data-category="sports" onclick="playChannel('https://bdedatv.bdixsports.com/tsports/index.m3u8', 'T Sports HD', this)">
                <div class="logo-bubble"><img src="https://i.postimg.co/N0f0zXnY/tsports.png" onerror="this.src='https://i.postimg.co/D0m4mGfW/tv-placeholder.png'" alt="T Sports"></div>
                <div class="channel-name">T Sports HD</div>
                <div class="channel-tag">Sports</div>
            </div>
            <div class="grid-card" data-category="sports" onclick="playChannel('https://pubads.g.doubleclick.net/ssai/event/V_S8f73SRe6u-kY7HwA79A/master.m3u8', 'beIN Sports', this)">
                <div class="logo-bubble"><img src="https://i.postimg.co/wB7X8Ynm/bein.png" onerror="this.src='https://i.postimg.co/D0m4mGfW/tv-placeholder.png'" alt="beIN"></div>
                <div class="channel-name">beIN Sports</div>
                <div class="channel-tag">Sports</div>
            </div>

            <div class="grid-card" data-category="entertainment" onclick="playChannel('https://bdedatv.bdixsports.com/starjalsha/index.m3u8', 'Star Jalsha', this)">
                <div class="logo-bubble"><img src="https://i.postimg.co/zXg7w8km/starjalsha.png" onerror="this.src='https://i.postimg.co/D0m4mGfW/tv-placeholder.png'" alt="Star Jalsha"></div>
                <div class="channel-name">Star Jalsha</div>
                <div class="channel-tag">Ent</div>
            </div>
            <div class="grid-card" data-category="entertainment" onclick="playChannel('https://bdedatv.bdixsports.com/ntv/index.m3u8', 'NTV', this)">
                <div class="logo-bubble"><img src="https://i.postimg.co/tCg3vC9n/ntv.png" onerror="this.src='https://i.postimg.co/D0m4mGfW/tv-placeholder.png'" alt="NTV"></div>
                <div class="channel-name">NTV</div>
                <div class="channel-tag">Ent</div>
            </div>

        </div>
    </div>

    <div class="footer-branding">
        POWERED BY LIVE TV BD | DEVELOPED BY <span>NAITIK</span>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        var player = videojs('my-video');
        
        // Initial load using public universal stream
        player.src({
            src: 'https://bdedatv.bdixsports.com/somoy/index.m3u8',
            type: 'application/x-mpegURL'
        });

        function playChannel(url, name, cardElement) {
            player.src({ src: url, type: 'application/x-mpegURL' });
            player.load();
            player.play().catch(function(error) {
                console.log("Stream standard loading configuration active.");
            });
            
            document.getElementById('current-channel-title').innerText = name;
            var cards = document.getElementsByClassName('grid-card');
            for (var i = 0; i < cards.length; i++) { cards[i].classList.remove('active'); }
            cardElement.classList.add('active');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterCategory(category, tabElement) {
            var tabs = document.getElementsByClassName('cat-tab');
            for (var i = 0; i < tabs.length; i++) { tabs[i].classList.remove('active'); }
            tabElement.classList.add('active');
            
            var cards = document.getElementsByClassName('grid-card');
            for (var i = 0; i < cards.length; i++) {
                var cardCat = cards[i].getAttribute('data-category');
                cards[i].style.display = (category === 'all' || cardCat === category) ? 'flex' : 'none';
            }
        }
    </script>
</body>
</html>
