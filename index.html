        /* অ্যানিমেটেড লোগো সেকশন */
        .sidebar-header { padding: 25px 20px; background-color: rgba(0, 0, 0, 0.2); border-bottom: 1px solid rgba(255, 255, 255, 0.05); text-align: center; }
        
        .animated-logo { font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; background: linear-gradient(45deg, #00f2fe, #4facfe, #00f2fe); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 3s linear infinite, pulse 2s infinite alternate; text-shadow: 0 0 20px rgba(79, 172, 254, 0.3); }

        @keyframes shine { to { background-position: 200% center; } }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.02); } }

        .channel-list { flex: 1; overflow-y: auto; padding: 20px 15px; }
        .channel-list::-webkit-scrollbar { width: 5px; }
        .channel-list::-webkit-scrollbar-thumb { background: #252538; border-radius: 10px; }
        
        /* ক্যাটাগরি ডিজাইন */
        .category-title { font-size: 12px; text-transform: uppercase; color: #65657b; margin: 20px 0 10px 5px; font-weight: 700; letter-spacing: 2px; }
        
        /* মডার্ন চ্যানেল বাটন */
        .channel-btn { width: 100%; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); color: #bcbcbc; padding: 14px 18px; text-align: left; border-radius: 12px; cursor: pointer; margin-bottom: 10px; font-size: 15px; font-weight: 500; display: flex; align-items: center; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .channel-btn:hover { background: rgba(79, 172, 254, 0.08); border-color: #4facfe; color: #fff; padding-left: 24px; box-shadow: 0 5px 15px rgba(79, 172, 254, 0.1); }
        .channel-btn.active { background: linear-gradient(45deg, #00f2fe, #4facfe); color: #000000; font-weight: 700; border-color: transparent; box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3); }
        .channel-icon { margin-right: 12px; font-size: 18px; }

        /* ডান পাশের প্রিমিয়াম প্লেয়ার এরিয়া */
        .main-content { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at top right, #141420, #08080c); padding: 30px; justify-content: center; align-items: center; }
        .video-wrapper { width: 100%; max-width: 1000px; aspect-ratio: 16/9; background: #000; box-shadow: 0 25px 60px rgba(0,0,0,0.8); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.03); }
        
        /* প্লেয়ার ভেতরের মডিফিকেশন */
        .video-js { width: 100% !important; height: 100% !important; font-family: 'Poppins', sans-serif; }
        .vjs-big-play-centered .vjs-big-play-button { background: linear-gradient(45deg, #00f2fe, #4facfe) !important; border: none !important; width: 70px !important; height: 70px !important; line-height: 70px !important; border-radius: 50% !important; box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4); }

        /* ইনফো ফুটার বার */
        .player-footer { width: 100%; max-width: 1000px; margin-top: 25px; padding: 0 10px; display: flex; justify-content: space-between; align-items: center; }
        .player-footer h3 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; color: #fff; }
        .status-badge { background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.2); color: #00f2fe; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; background-color: #00f2fe; border-radius: 50%; animation: blink 1.5s infinite; }
        
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>

    <script>
        var player = videojs('my-video');
        
        // অটো-লোড প্রথম চ্যানেল
        player.src({
            src: 'http://172.16.172.114:8083/SomoyTv/tracks-v1a1/mono.m3u8?token=6d4b47cf6c9aebf2cc831e28bfa992d2a88e8dda-0ced35771400c88d016da67d903f93b6-1781868359-1781857559',
            type: 'application/x-mpegURL'
        });

        function playChannel(url, name, buttonElement) {
            player.src({
                src: url,
                type: 'application/x-mpegURL'
            });
            player.play();

            document.getElementById('current-channel-title').innerText = name;

            var buttons = document.getElementsByClassName('channel-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            buttonElement.classList.add('active');
        }
