<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV BD - Premium IPTV</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Hind Siliguri', sans-serif; }
        body { background-color: #0b0b0f; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        .header-bar { padding: 18px; text-align: center; background: #07070a; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        .animated-logo { font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; background: linear-gradient(45deg, #ff007f, #7928ca, #00f2fe); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 3s linear infinite; text-shadow: 0 0 15px rgba(121, 40, 202, 0.2); }
        @keyframes shine { to { background-position: 200% center; } }

        .player-container { width: 100%; background: #000; position: relative; aspect-ratio: 16/9; max-height: 40vh; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .video-js { width: 100% !important; height: 100% !important; }
        .vjs-big-play-centered .vjs-big-play-button { background: linear-gradient(45deg, #ff007f, #7928ca) !important; border: none !important; width: 65px !important; height: 65px !important; line-height: 65px !important; border-radius: 50% !important; }

        .info-strip { background: #111116; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
        .info-strip h2 { font-size: 17px; font-weight: 600; color: #fff; }
        .live-badge { background: rgba(255, 0, 127, 0.1); border: 1px solid rgba(255, 0, 127, 0.2); color: #ff007f; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .badge-dot { width: 6px; height: 6px; background-color: #ff007f; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .category-nav { display: flex; overflow-x: auto; white-space: nowrap; padding: 15px 10px; background: #0b0b0f; gap: 10px; scrollbar-width: none; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-tab { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); color: #a0a0ab; padding: 8px 18px; border-radius: 25px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; }
        .cat-tab:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
        .cat-tab.active { background: #ffffff; color: #000000; font-weight: 600; border-color: #ffffff; box-shadow: 0 4px 12px rgba(255,255,255,0.15); }

        .content-section { flex: 1; padding: 10px 15px 25px 15px; background: #0b0b0f; }
        .channel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        
        .grid-card { background: #14141f; border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; transition: all 0.2s ease; min-height: 110px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .grid-card:hover { transform: translateY(-2px); border-color: #ff007f; }
        .grid-card.active { border-color: #ff007f; background: linear-gradient(145deg, #1c0f24, #14141f); box-shadow: 0 8px 20px rgba(255, 0, 127, 0.15); }

        .logo-bubble { width: 50px; height: 50px; background: #1a1a26; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; border: 1px solid rgba(255, 255, 255, 0.06); overflow: hidden; padding: 6px; transition: all 0.2s ease; }
        .logo-bubble img { width: 100%; height: 100%; object-fit: contain; }
        
        .grid-card.active .logo-bubble { border-color: #ff007f; background: #ffffff; box-shadow: 0 0 12px rgba(255, 0, 127, 0.4); }
        
        .channel-name { font-size: 11px; font-weight: 500; color: #e2e2e9; line-height: 1.3; }
        .channel-tag { font-size: 9px; color: #65657b; margin-top: 3px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }

        .footer-branding { text-align: center; padding: 20px; background: #07070a; border-top: 1px solid rgba(255, 255, 255, 0.03); font-size: 12px; color: #555566; letter-spacing: 1px; font-weight: 500; }
        .footer-branding span { color: #ff007f; font-weight: 600; }
    </style>
</head>
<body>

                <div class="logo-bubble"><img src="https://i.ibb.co/kH7D4vY/tsports.png" alt="T Sports"></div>
                <div class="channel-name">T Sports HD</div>

            </div>

                <div class="logo-bubble"><img src="https://i.ibb.co/zXg7w8k/starjalsha.png" alt="Star Jalsha"></div>

        POWERED BY LIVE TV BD | DEVELOPED BY <span>NAITIK</span>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        var player = videojs('my-video');
        player.src({
            src: 'http://172.16.172.114:8083/SomoyTv/tracks-v1a1/mono.m3u8?token=6d4b47cf6c9aebf2cc831e28bfa992d2a88e8dda-0ced35771400c88d016da67d903f93b6-1781868359-1781857559',
            type: 'application/x-mpegURL'
        });

        function playChannel(url, name, cardElement) {
            player.src({ src: url, type: 'application/x-mpegURL' });
            player.play().catch(function(error) {
                console.log("Playback failed, waiting for user interaction.");
            });
            document.getElementById('current-channel-title').innerText = name;
            var cards = document.getElementsByClassName('grid-card');
            for (var i = 0; i < cards.length; i++) { cards[i].classList.remove('active'); }
            cardElement.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterCategory(category, tabElement) {
            var tabs = document.getElementsByClassName('cat-tab');
            for (var i = 0; i < tabs.length; i++) { tabs[i].classList.remove('active'); }
            tabElement.classList.add('active');
            var cards = document.getElementsByClassName('grid-card');
            for (var i = 0; i < cards.length; i++) {
                var cardCat = cards[i].getAttribute('data-category');
                cards[i].style.display = (category === 'all' || cardCat === category) ? 'flex' : 'none';
            }
        }
    </script>
